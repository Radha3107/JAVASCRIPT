<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Scholarship Eligibility Checker - Enter your marks to find your scholarship category">
    <title>Scholarship Eligibility Checker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="container">
        <header class="header">
            <div class="logo">
                <span class="logo-icon">
                    <!-- Graduation Cap -->
                    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M24 6L2 18L24 30L46 18L24 6Z" fill="#e8e8ed" stroke="#ffffff" stroke-width="1"/>
                        <path d="M12 24V36L24 42L36 36V24L24 30L12 24Z" fill="#b0b0be" stroke="#d0d0d8" stroke-width="0.5"/>
                        <line x1="40" y1="18" x2="40" y2="38" stroke="#d0d0d8" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M37 38C37 36.3 38.3 35 40 35C41.7 35 43 36.3 43 38C43 39.7 41.7 42 40 42C38.3 42 37 39.7 37 38Z" fill="#d0d0d8"/>
                    </svg>
                </span>
                <h1>Scholarship Eligibility</h1>
            </div>
            <p class="subtitle">Enter your marks to discover your scholarship category</p>
        </header>

        <main class="main-card" id="mainCard">
            <div class="input-section">
                <label for="marksInput" class="input-label">Enter Your Marks</label>
                <div class="input-wrapper">
                    <input 
                        type="number" 
                        id="marksInput" 
                        min="0" 
                        max="100" 
                        placeholder="0 – 100"
                        autocomplete="off"
                    >
                    <span class="input-suffix">/ 100</span>
                </div>
                <button id="checkBtn" onclick="checkScholarship()">
                    <span>Check Eligibility</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </button>
            </div>

            <div class="result-section" id="resultSection">
                <div class="result-card" id="resultCard">
                    <div class="result-icon" id="resultIcon"></div>
                    <h2 class="result-title" id="resultTitle"></h2>
                    <p class="result-marks" id="resultMarks"></p>
                    <p class="result-message" id="resultMessage"></p>
                </div>
            </div>
        </main>

        <section class="criteria-section">
            <h2 class="criteria-heading">Scholarship Criteria</h2>
            <div class="criteria-grid">
                <div class="criteria-item not-eligible">
                    <div class="criteria-bar"></div>
                    <div class="criteria-icon">
                        <!-- Shield with X -->
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2L4 6V12C4 16.42 7.4 20.56 12 22C16.6 20.56 20 16.42 20 12V6L12 2Z" fill="#2a1215" stroke="#ef4444" stroke-width="1.5"/>
                            <path d="M9.5 9.5L14.5 14.5M14.5 9.5L9.5 14.5" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <div class="criteria-range">Below 50</div>
                    <div class="criteria-label">Not Eligible</div>
                </div>
                <div class="criteria-item bronze">
                    <div class="criteria-bar"></div>
                    <div class="criteria-icon">
                        <!-- Bronze Medal -->
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M8 2H16L14.5 7H9.5L8 2Z" fill="#a0522d"/>
                            <path d="M10 2L8 7" stroke="#8b4513" stroke-width="0.5"/>
                            <path d="M14 2L16 7" stroke="#8b4513" stroke-width="0.5"/>
                            <circle cx="12" cy="14.5" r="7" fill="#cd7f32" stroke="#a0622a" stroke-width="0.8"/>
                            <circle cx="12" cy="14.5" r="5.2" fill="none" stroke="#daa06d" stroke-width="0.6"/>
                            <path d="M10 13L11.5 15L14.5 11.5" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="criteria-range">50 – 69</div>
                    <div class="criteria-label">Bronze</div>
                </div>
                <div class="criteria-item silver">
                    <div class="criteria-bar"></div>
                    <div class="criteria-icon">
                        <!-- Silver Medal -->
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M8 2H16L14.5 7H9.5L8 2Z" fill="#8a8a98"/>
                            <path d="M10 2L8 7" stroke="#707080" stroke-width="0.5"/>
                            <path d="M14 2L16 7" stroke="#707080" stroke-width="0.5"/>
                            <circle cx="12" cy="14.5" r="7" fill="#c0c0c0" stroke="#a8a8b0" stroke-width="0.8"/>
                            <circle cx="12" cy="14.5" r="5.2" fill="none" stroke="#d8d8e0" stroke-width="0.6"/>
                            <path d="M10 13L11.5 15L14.5 11.5" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="criteria-range">70 – 84</div>
                    <div class="criteria-label">Silver</div>
                </div>
                <div class="criteria-item gold">
                    <div class="criteria-bar"></div>
                    <div class="criteria-icon">
                        <!-- Gold Medal -->
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M8 2H16L14.5 7H9.5L8 2Z" fill="#daa520"/>
                            <path d="M10 2L8 7" stroke="#b8860b" stroke-width="0.5"/>
                            <path d="M14 2L16 7" stroke="#b8860b" stroke-width="0.5"/>
                            <circle cx="12" cy="14.5" r="7" fill="#ffd700" stroke="#daa520" stroke-width="0.8"/>
                            <circle cx="12" cy="14.5" r="5.2" fill="none" stroke="#ffe44d" stroke-width="0.6"/>
                            <path d="M10 13L11.5 15L14.5 11.5" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="criteria-range">85 – 94</div>
                    <div class="criteria-label">Gold</div>
                </div>
                <div class="criteria-item platinum">
                    <div class="criteria-bar"></div>
                    <div class="criteria-icon">
                        <!-- Diamond/Trophy -->
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M5 4H19L21 8L12 20L3 8L5 4Z" fill="#e5e4e2" stroke="#c8c8c6" stroke-width="0.8"/>
                            <path d="M3 8H21" stroke="#d0d0ce" stroke-width="0.6"/>
                            <path d="M12 20L8.5 8L10 4" stroke="#c8c8c6" stroke-width="0.5"/>
                            <path d="M12 20L15.5 8L14 4" stroke="#c8c8c6" stroke-width="0.5"/>
                            <path d="M8.5 8L10 4H14L15.5 8" fill="#f0efed" stroke="none"/>
                        </svg>
                    </div>
                    <div class="criteria-range">95 – 100</div>
                    <div class="criteria-label">Platinum</div>
                </div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
